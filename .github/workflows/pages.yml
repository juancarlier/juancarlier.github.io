name: Deploy personal website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p _site/assets/css _site/assets/js _site/homepage_assets _site/cv
          cp index.html _site/
          cp assets/css/home.css assets/css/personal.css _site/assets/css/
          cp assets/js/home.js _site/assets/js/
          cp homepage_assets/cover_2560.jpg homepage_assets/cover_1280.jpg homepage_assets/juan-carlier.jpg _site/homepage_assets/
          cp homepage_assets/umd-logo.png _site/homepage_assets/
          cp cv/Juan_Carlier_CV.txt _site/cv/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
